spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lease_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Mysql123
  application:
    name:lease-management

  jpa:
    hibernate:
      ddl-auto: validate   # validate schema matches, don't auto create
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  jackson:
    time-zone: Asia/Kolkata

app:
  cors-allowed-origins: "http://localhost:5173,http://127.0.0.1:5173,http://0.0.0.0:5173"

server:
  address: 0.0.0.0
  port: 8080